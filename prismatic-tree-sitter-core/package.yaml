name: prismatic-tree-sitter-core
_common: !include "../package-common.yaml"

<<: *commonTopLevel

library:
  dependencies:
   - template-haskell >= 2.20 && < 3
   - array
   - text
   - bytestring
   - mtl
   - errata
  source-dirs: src
  include-dirs:
    - vendor/lib/include
    - vendor/lib/src
    - cbits
  install-includes:
    - tree_sitter/api.h
  c-sources:
    - vendor/lib/src/lib.c
    - cbits/tree_sitter_ffi_bridge.c
  cc-options:
    - -std=c99
    # https://github.com/amartani/covers/commit/00d61bd5aa8eaa7528652b3ea609d0af9fcf03ed
    - -D_GNU_SOURCE
    - -Wno-gnu-folding-constant

tests:
  core-tests:
    main: Spec.hs
    build-tools:
     - hspec-discover:hspec-discover
    dependencies:
     - prismatic-tree-sitter-core
     - hspec
     - hspec-contrib
     - hspec-discover
     - text
    source-dirs: test
    include-dirs:
     - tst-cbits
     - ./tst-vendor/json-grammar/grammar
     - ./tst-vendor/json-grammar/grammar/src
    ghc-options:
     # Some of the tested functions are partial, no point
     # in complaining about it
     - -Wx-no-partial
    cc-options:
      - -std=c99
      # https://github.com/amartani/covers/commit/00d61bd5aa8eaa7528652b3ea609d0af9fcf03ed
      - -D_GNU_SOURCE
      - -Wno-gnu-folding-constant
